# G1-D WBIK task / solver weights, SHADOW GATE on Yaw_Joint.
# Solver: solver/shadow_gate_ik.py (ShadowGatedIK).
# The hard-gate variant is wbik_g1d_hardgate.yaml; everything outside
# the gate block is identical between the two files.
# Topology is in model_cfg.
# First-pass costs copy RBY1 wbik.yaml (not the tuned R1 Pro yaml).
model_cfg: "/model/g1d/g1d_model.yaml"
model_path: "/model/g1d/g1d.xml"

use_ik_adjustment: true
# AGV_link is mid-chassis; wheel-mesh bottoms are at z=-0.1113 when q_z=0.
initial_base_z: 0.1113
legacy:
  torso_upright_ori_cost: 10
  com_over_base_pos_cost: 10.0
  com_target_height: 0.8
  nominal_torso_rad: [0.05, 0.05, 0.0, 0.0]
  nominal_right_arm_rad: [0.0, -0.25, 0.0, 0.9, 0.0, 0.0, 0.0]
  nominal_left_arm_rad: [0.0, 0.25, 0.0, 0.9, 0.0, 0.0, 0.0]
  nominal_head_rad: []

# Task cost weights (RBY1 first-pass numbers)
ee_pos_cost: 10000
ee_ori_cost: 2000
# EE Levenberg-Marquardt. μ = ee_lm_damping · ||W e||² on Δq.
# 0.5: no no-solution frames on the three recordings now that
# whole_body_ik.py retries a failed solve with the objective scaled down
# (the old "0.5 locks after a miss" was daqp misreporting). Versus 0.1,
# loco_9 frames with the arms swinging back and forth drop from ~42 to 3-6.
# The hard gate is still 0.1.
ee_lm_damping: 0.5
# EE ori cannot drive these dofs. Pos still can. Kept from the hard gate:
# without it the nod cannot start from fully upright (loco_9 frames
# 290-320 stall at the -2.5 deg limit with ~45 cm hand error).
ee_ori_exclude_joints: [Yaw_Joint]

# Shadow gate. Every solve step, two shadow robots chase the hand positions
# predicted predictive_horizon ahead. The lock shadow has shadow_gate_joint
# welded at 0; the free shadow may nod. Shadows never feed the real robot;
# they only decide whether the real robot's nod is released or held.
shadow_gate_joint: Yaw_Joint
# Shadows' own ee_lm_damping. 0.5 would make the lock shadow stall with a
# large error and keep the nod released after the hands come back.
shadow_ee_lm_damping: 1.0e-5
# Release / hold on the free shadow's advantage (lock error - free error) only.
release_free_shadow_greater_than_lock_shadow: 0.03  # [m] release when the advantage is above this
held_free_shadow_greater_than_lock_shadow: 0.015    # [m] hold again when it drops below this
# There used to be a second release condition, lock shadow error > 5 cm.
# It made the real robot first use up standing straight (lifts at the
# bottom, chassis at hand_forward_min), the arms chattered +-8 deg per frame,
# then the nod started at full speed (quest_slow_bend_2 frames 150-160). An
# advantage above 3 cm already implies a lock error above 3 cm.
# While held, the joint must come back toward 0 by at least this per solve
# step (straight to 0 when closer); it may come back faster when the hands
# pull it. At 0 this means no forward nod. Per step, so it scales with dt.
held_min_return_per_step: 0.03490658503988659       # [rad] (2 deg, exact)
# Shadow hand-position prediction.
# 0.4 (was 0.3): slow squats (quest_slow_bend_1) release 0.3-0.6 s ahead
# instead of 0.15-0.3 s; 0.5 brings back >1.5 s early releases on loco_9.
predictive_horizon: 0.4          # [s]
predictive_velocity_frames: 3    # velocity from the last N hand targets
# 0.15 (was 0.3): fast hand moves (loco_9 835-850, hands pulled back) put
# the predicted hands 30 cm off and swinging direction every frame; the lock
# shadow twisted itself chasing them (left shoulder ~105 deg, waist -31 deg)
# and the nod was released while standing straight reaches. Slow squats move
# 0.17-0.24 m/s, about 0.1 m in 0.4 s, so 0.15 does not cut them.
predictive_max_shift: 0.15       # [m] cap on the extrapolated shift
# The lock shadow should look like the real robot would right now, upright.
# Each step both shadows start from the real robot's chassis pose; false =
# shadow chassis runs free and drifts (up to ~50 cm on loco_9).
shadow_follow_real_chassis: true
# Shadows' arm nominal-posture cost (robot: nominal_posture_cost_arm 50).
# At 50 the lock shadow twists its shoulders ~90 deg off nominal to reach;
# at 300 its shoulders match the free shadow and the real robot. 1000 keeps
# the nod released too long, 3000 gives no-solution stretches. Omit = 50.
shadow_nominal_posture_cost_arm: 300
# Shadows' torso nominal-posture cost (lifts, nod, waist; robot: 50, waist
# 300). At 50 the free shadow keeps its own joints between frames and, while
# the lock shadow still reaches, drifts to nod ~100 deg with both lifts near
# the top (quest_slow_bend_1 frames 185-230), unlike the real robot. At 300
# it stays near upright until nodding actually helps. Real robot unchanged
# on all three recordings. Omit = robot's.
shadow_nominal_posture_cost_torso: 300

head_pos_cost: 10000
head_ori_cost: [10000, 10000, 10000]
nominal_posture_cost_torso: 50
nominal_posture_cost_arm: 50
nominal_posture_cost_head: 0.0
# Waist yaw only (torso_Joint). The shared torso cost above also covers the
# nod and the lifts. At 50 a slow squat twists the waist ~90 deg once the
# chassis cannot get closer to the hands, and the nod never starts. 300
# keeps the waist near 0 and the nod reaches; 1000 adds no-solution frames
# on loco_9. Same value in the hard gate.
nominal_posture_cost_waist: 300
current_posture_cost_main: 50
current_posture_cost_head: 0.0
com_over_base_pos_cost: 0.0
com_over_base_xy_bounds: [0.08, 0.08]
base_ground_position_cost: [50.0, 50.0, 100000.0]
base_ground_orientation_cost: [100000.0, 100000.0, 50.0]
# Minimum forward gap: how far the hand midpoint is ahead of the chassis,
# along the chassis heading, horizontal. The gap may shrink to this; if it
# is already smaller it may not shrink further (by driving or by turning);
# nothing pushes it back out. Hands behind the chassis: backing up is still
# allowed. Stops the chassis creeping under the hands while the nod is held.
# 0.30 (was 0.20): quest_slow_bend_1 second bend releases 4 frames earlier
# and the chassis backs off at 0.44 m/s instead of 0.91; loco_9 unchanged.
# 0.35 releases 8 frames earlier but adds releases on loco_9. 0 disables.
# Same value in the hard gate.
hand_forward_min: 0.30

# Sitting / ready seed (not occupancy yet).
# torso: [LZ_mt m, LZ_it m, Yaw_Joint rad, torso_Joint rad]
# First two are metres despite the _rad suffix. Official G1-D default
# from WBC_control_interface (.../unitree/g1d/robot_config.py).
nominal_torso_rad: [0.05, 0.05, 0.0, 0.0]
nominal_right_arm_rad: [0.0, -0.25, 0.0, 0.9, 0.0, 0.0, 0.0]
nominal_left_arm_rad: [0.0, 0.25, 0.0, 0.9, 0.0, 0.0, 0.0]
nominal_head_rad: []

# Collision avoidance distances (meters)
safety_distance: 0.01
influence_distance: 0.02

# Velocity limits.
# Prismatic: URDF velocity="0.05" is already m/s — copy as-is.
# Revolute: URDF Yaw/torso=5, arms=37. First-pass caps to the RBY1
# π family (same as R1 Pro). Do not write 0 on a live waist axis.
velocity_limit_scale: 0.9
base_xy_velocity_limit: 1.0
base_rz_velocity_limit: 1.0
joint_velocity_limits:
  LZ_mt_Joint: 0.05
  LZ_it_Joint: 0.05
  Yaw_Joint: 3.1416
  torso_Joint: 3.1416
  left_shoulder_pitch_joint: 3.1416
  left_shoulder_roll_joint: 3.1416
  left_shoulder_yaw_joint: 3.1416
  left_elbow_joint: 3.1416
  left_wrist_roll_joint: 6.2832
  left_wrist_pitch_joint: 6.2832
  left_wrist_yaw_joint: 6.2832
  right_shoulder_pitch_joint: 3.1416
  right_shoulder_roll_joint: 3.1416
  right_shoulder_yaw_joint: 3.1416
  right_elbow_joint: 3.1416
  right_wrist_roll_joint: 6.2832
  right_wrist_pitch_joint: 6.2832
  right_wrist_yaw_joint: 6.2832
  Left_Wheel_Joint: 0.0
  Right_Wheel_Joint: 0.0
  left_hand_thumb_0_joint: 0.0
  left_hand_thumb_1_joint: 0.0
  left_hand_thumb_2_joint: 0.0
  left_hand_middle_0_joint: 0.0
  left_hand_middle_1_joint: 0.0
  left_hand_index_0_joint: 0.0
  left_hand_index_1_joint: 0.0
  right_hand_thumb_0_joint: 0.0
  right_hand_thumb_1_joint: 0.0
  right_hand_thumb_2_joint: 0.0
  right_hand_middle_0_joint: 0.0
  right_hand_middle_1_joint: 0.0
  right_hand_index_0_joint: 0.0
  right_hand_index_1_joint: 0.0

# Solver settings
solver: "daqp"
damping: 1.0e-6
