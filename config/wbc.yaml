# Robot gRPC address
# address: "192.168.30.1:50051"
address: "localhost:50051"

# Robot configuration parameters
# model_path: "/model/rby1/rby1_mocap.xml"
model_path: "/model/rby1/rby1.xml"
init_position:
  torso: [0.0, 0.7854, -1.5708, 0.7854, 0.0, 0.0]
  left_arm: [0.0, 0.0873, 0.0, -2.0944, 0.0, 0.9599, -1.5708]
  right_arm: [0.0, -0.0873, 0.0, -2.0944, 0.0, 0.9599, 1.5708]
  head: [0.0, 0.6109]
  grippers: [0.1, 0.1]

# Controller parameters
state_frequency_hz: 100.0
trajectory_frequency_hz: 10.0
ik_frequency_hz: 100.0
use_interpolation: true
command_timeout_sec: 0.1
# Base control gains
base_error_gain: [0.2, 0.2, 0.2]  # TRI's IK runs at 500hz and ours at 100hz, so scale the gains by 5x
base_velocity_gain: [0.1, 0.1, 0.12] # Might need to tune this more