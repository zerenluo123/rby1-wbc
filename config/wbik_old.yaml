  # torso_1: 0.0  
  torso_1: 2.0944 # for torso joint movement
  # torso_2: 0.0  
  torso_2: 3.1416  # for torso joint movement
  torso_3: 3.1416   # for torso joint movement
  torso_3: 0.0
  torso_4: 0.0
  torso_5: 0.0
  left_arm_0: 3.1416
