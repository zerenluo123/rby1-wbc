# MuJoCo model path (relative to project root)
model_path: "/model/rby1/rby1.xml"

# Use the post-PR IK adjustment flow (set false to use legacy solver/tasks).
use_ik_adjustment: true
legacy:
  torso_upright_ori_cost: 500
  com_over_base_pos_cost: 10.0
  com_target_height: 0.8
  nominal_torso_rad: [0.0, 0.7854, -1.5708, 0.7854, 0.0, 0.0]
  nominal_right_arm_rad: [0.0, -0.0873, 0.0, -2.0944, 0.0, 0.9599, 1.5708]
  nominal_left_arm_rad: [0.0, 0.0873, 0.0, -2.0944, 0.0, 0.9599, -1.5708]
  nominal_head_rad: [0.0, 0.6109]

# Task cost weights
ee_pos_cost: 10000
ee_ori_cost: 10000
head_pos_cost: 0
head_ori_cost: [0, 10000, 10000]
nominal_posture_cost_main: 50
nominal_posture_cost_head: 0.0
current_posture_cost_main: 50
current_posture_cost_head: 0.0
com_over_base_pos_cost: 100000.0
com_over_base_xy_bounds: [0.08, 0.08]  # meters (|torso5_xy - base_xy| <= bound, in base frame)
base_ground_position_cost: [50.0, 50.0, 100000.0]
base_ground_orientation_cost: [100000.0, 100000.0, 50.0]

# Nominal/reference joint angles (radians)
nominal_torso_rad: [0.0, 0.7854, -0.96, 0.1746, 0.0, 0.0]
# nominal_torso_rad: [0.0, 0.7854, -0.96, 0.261799, 0.0, 0.0]
# nominal_right_arm_rad:  [0.96, -0.7, 0.096, -2.4, 0.23, 0.187, 0.8]
# nominal_right_arm_rad: [0.87, -0.594, 0.167, -2.18, 0.285, 0.056, 0.849]
# nominal_right_arm_rad: [0.915, -0.562, 0.196, -2.33, 0.313, 0.184, 0.866]
nominal_right_arm_rad: [0.892, -0.514, 0.201, -2.298, 0.329, 0.193, 0.874]
# nominal_left_arm_rad: [0.96, 0.7, -0.096, -2.4, -0.23, 0.187, -0.8]
# nominal_left_arm_rad: [0.87, 0.594, -0.167, -2.18, -0.285, 0.056, -0.849]
# nominal_left_arm_rad: [0.915, 0.562, -0.196, -2.33, -0.313, 0.184, -0.866]
nominal_left_arm_rad: [0.892, 0.514, -0.201, -2.298, -0.329, 0.193, -0.874]
nominal_head_rad: [0.0, 0.872665]
# nominal_head_rad: [0.0, 1.0472]

# nominal_torso_rad: [0.0, 0.558505, -1.29154, 0.733038, 0.0, 0.0]
# nominal_right_arm_rad: [0.959931, -0.523599, 0.174533, -2.19911, 0.349066, 0, 0.872665]
# nominal_left_arm_rad: [0.959931, 0.523599, -0.174533, -2.19911, -0.349066, 0, -0.872665]
# nominal_head_rad: [0.0, 0.872665]


# Collision avoidance distances (meters)
safety_distance: 0.01
influence_distance: 0.02

# Velocity limits
velocity_limit_scale: 0.9
base_xy_velocity_limit: 1.0   # m/s
base_rz_velocity_limit: 1.0   # rad/s
joint_velocity_limits:
  torso_0: 0.0
  # torso_1: 0.0  
  torso_1: 2.0944 # for torso joint movement
  # torso_2: 0.0  
  torso_2: 3.1416  # for torso joint movement
  torso_3: 3.1416   # for torso joint movement
  # torso_3: 0.0
  torso_4: 0.0
  torso_5: 0.0
  left_arm_0: 3.1416
  left_arm_1: 3.1416
  left_arm_2: 3.1416
  left_arm_3: 3.1416
  left_arm_4: 6.2832   # 360 deg/s
  left_arm_5: 6.2832
  left_arm_6: 6.2832
  right_arm_0: 3.1416
  right_arm_1: 3.1416
  right_arm_2: 3.1416
  right_arm_3: 3.1416
  right_arm_4: 6.2832
  right_arm_5: 6.2832
  right_arm_6: 6.2832

# Solver settings
solver: "daqp"
damping: 1.0e-6
