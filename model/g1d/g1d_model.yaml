# Unitree G1-D topology for WholeBodyIK. Names match g1d.xml / g1_d.urdf.
model_path: "/model/g1d/g1d.xml"

frames:
  base: AGV_link
  # CoM XY box. Measured, not copied from R1 Pro torso_link3.
  # torso_link: 30° Yaw_Joint nod swings chest-base XY 5.3 → 10.5 cm
  #   (already outside ±8 cm); 90° → 16 cm. Box would kill the nod.
  # Pitching_Link: almost on the AGV XY (0.02 cm). Nod/twist/lift do not
  #   move it. Box is centered on the column, but the body is below the
  #   nod joint.
  # Yaw_Link: origin of the Y-axis nod joint (G1-D analog of torso_link3).
  #   Lift / nod / torso_Joint twist leave XY at +5.57 cm (joint is
  #   offset forward). Teacher is that offset; box does not fight nod.
  # Pure-Z prismatic lift does not change chest-base XY for any body.
  chest: Yaw_Link
  end_effector_l: left_hand_palm_link_site
  end_effector_r: right_hand_palm_link_site
  head: head_link_site

joints:
  floating_base: base_link_free
  torso: [LZ_mt_Joint, LZ_it_Joint, Yaw_Joint, torso_Joint]
  left_arm: [left_shoulder_pitch_joint, left_shoulder_roll_joint, left_shoulder_yaw_joint, left_elbow_joint, left_wrist_roll_joint, left_wrist_pitch_joint, left_wrist_yaw_joint]
  right_arm: [right_shoulder_pitch_joint, right_shoulder_roll_joint, right_shoulder_yaw_joint, right_elbow_joint, right_wrist_roll_joint, right_wrist_pitch_joint, right_wrist_yaw_joint]
  head: []
  wheels: [Left_Wheel_Joint, Right_Wheel_Joint]

collision_groups:
  body:
    prefixes:
      - AGV_link_col
      - LZ_ot_Link_col
      - Pitching_Link_col
      - Yaw_Link_col
      - torso_link_col
      - head_link_col
  left_arm:
    prefixes:
      - left_shoulder_
      - left_elbow_
      - left_wrist_
      - left_hand_
  right_arm:
    prefixes:
      - right_shoulder_
      - right_elbow_
      - right_wrist_
      - right_hand_

collision_pairs:
  - [body, left_arm]
  - [body, right_arm]
  - [left_arm, right_arm]

constraints:
  joint_locks:
    Left_Wheel_Joint: 0.0
    Right_Wheel_Joint: 0.0
    left_hand_thumb_0_joint: 0.0
    left_hand_thumb_1_joint: 0.0
    left_hand_thumb_2_joint: 0.0
    left_hand_middle_0_joint: 0.0
    left_hand_middle_1_joint: 0.0
    left_hand_index_0_joint: 0.0
    left_hand_index_1_joint: 0.0
    right_hand_thumb_0_joint: 0.0
    right_hand_thumb_1_joint: 0.0
    right_hand_thumb_2_joint: 0.0
    right_hand_middle_0_joint: 0.0
    right_hand_middle_1_joint: 0.0
    right_hand_index_0_joint: 0.0
    right_hand_index_1_joint: 0.0
  joint_equalities: []

# Unused by WholeBodyIK. Nominal lives in config/wbik_g1d.yaml
# (nominal_torso_rad first two entries are metres).
