# RBY1 robot topology for WholeBodyIK. Solver / task weights stay in config/wbik.yaml.
model_path: "/model/rby1/rby1.xml"

frames:
  base: base
  chest: link_torso_5
  end_effector_l: end_effector_l
  end_effector_r: end_effector_r
  head: head

joints:
  floating_base: world_j
  torso: [torso_0, torso_1, torso_2, torso_3, torso_4, torso_5]
  left_arm: [left_arm_0, left_arm_1, left_arm_2, left_arm_3, left_arm_4, left_arm_5, left_arm_6]
  right_arm: [right_arm_0, right_arm_1, right_arm_2, right_arm_3, right_arm_4, right_arm_5, right_arm_6]
  head: [head_0, head_1]
  wheels: [wheel_fr, wheel_fl, wheel_rr, wheel_rl]

wheel_bodies:
  - link_wheel_fr
  - link_wheel_fl
  - link_wheel_rr
  - link_wheel_rl

robot_bodies:
  - base
  - wheel_fr_link
  - wheel_fl_link
  - wheel_rr_link
  - wheel_rl_link
  - link_torso_0
  - link_torso_1
  - link_torso_2
  - link_torso_3
  - link_torso_4
  - link_torso_5
  - link_head_1
  - link_head_2
  - link_right_arm_0
  - link_right_arm_1
  - link_right_arm_2
  - link_right_arm_3
  - link_right_arm_4
  - link_right_arm_5
  - link_right_arm_6
  - FT_SENSOR_R
  - EE_BODY_R
  - link_left_arm_0
  - link_left_arm_1
  - link_left_arm_2
  - link_left_arm_3
  - link_left_arm_4
  - link_left_arm_5
  - link_left_arm_6
  - FT_SENSOR_L
  - EE_BODY_L

collision_groups:
  body:
    prefixes:
      - base_col
      - torso_0_col
      - torso_1_col
      - torso_2_col
      - torso_4_col
      - torso_5_col
      - head_col
  left_arm:
    prefixes:
      - left_arm_
      - left_ee_col
      - left_finger_col
      - left_wrist_cam_col
  right_arm:
    prefixes:
      - right_arm_
      - right_ee_col
      - right_finger_col
      - right_wrist_cam_col

collision_pairs:
  - [body, left_arm]
  - [body, right_arm]
  - [left_arm, right_arm]

constraints:
  joint_locks:
    torso_0: 0.0
    torso_4: 0.0
    torso_5: 0.0
  joint_equalities:
    - joints: [torso_3, torso_1, torso_2]
      coeffs: [1.0, 1.0, 1.0]
